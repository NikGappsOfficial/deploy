name: Roll Back Stable Package Registry

on:
  workflow_dispatch:
    inputs:
      android_version:
        description: Android version to roll back
        type: string
        required: true
        default: '17'
      prior_release_id:
        description: Exact release ID previously active in releases/index.json
        type: string
        required: true
      apply:
        description: Publish rollback after validation (false = dry run)
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: stable-registry-publication
  cancel-in-progress: false

jobs:
  rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      G_TOKEN: ${{ secrets.G_TOKEN }}
      GIT_TERMINAL_PROMPT: '0'
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: credential.helper
      GIT_CONFIG_VALUE_0: ''
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - run: python -m pip install 'PyYAML~=6.0.3' 'python-dotenv~=1.2.4'

      - name: Resolve reviewed release credential loader
        id: engine
        run: |
          python - <<'PY'
          import os, yaml
          from pathlib import Path
          workflow = yaml.load(Path('.github/workflows/NikGappsAndroid17Release.yml').read_text(), Loader=yaml.BaseLoader)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f"commit={workflow['env']['RELEASE_COMMIT']}\n")
          PY

      - uses: actions/checkout@v7
        with:
          repository: nikhilmenghani/nikgapps-release
          ref: ${{ steps.engine.outputs.commit }}
          token: ${{ secrets.G_TOKEN }}
          path: release-engine
          persist-credentials: false

      - name: Load GitLab access from myenv
        run: |
          python release-engine/scripts/environment.py
          chmod +x "$GITHUB_WORKSPACE/release-engine/scripts/git_askpass.py"
          echo "GIT_ASKPASS=$GITHUB_WORKSPACE/release-engine/scripts/git_askpass.py" >> "$GITHUB_ENV"

      - name: Clone catalog
        run: |
          git clone https://gitlab.com/nikgapps/nikgapps-package-catalog.git catalog
          git -C catalog config user.name 'NikGapps Registry Rollback'
          git -C catalog config user.email 'actions@users.noreply.github.com'

      - name: Validate and optionally restore previous publication
        shell: bash
        env:
          ANDROID_VERSION: ${{ inputs.android_version }}
          PRIOR_RELEASE_ID: ${{ inputs.prior_release_id }}
          APPLY: ${{ inputs.apply }}
        run: |
          args=(--repo catalog --android-version "$ANDROID_VERSION" --prior-release-id "$PRIOR_RELEASE_ID")
          if [[ "$APPLY" == 'true' ]]; then args+=(--apply); fi
          python rollback_stable_registry.py "${args[@]}"
