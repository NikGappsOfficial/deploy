name: NikGapps Beta Source Updates

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      android_version:
        description: 'Android version, for example 17 or 12.1'
        type: string
        required: false
        default: '17'
      device:
        description: 'Google device codename, for example kodiak'
        type: string
        required: false
        default: 'kodiak'

env:
  ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
  USER_NAME: ${{ secrets.USER_NAME }}
  EMAIL: ${{ secrets.EMAIL }}
  SF_PWD: ${{ secrets.SF_PWD }}
  GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
  DEFAULT_ANDROID_VERSION: '17'
  DEFAULT_DEVICE: 'kodiak'

jobs:
  configure:
    runs-on: ubuntu-latest
    outputs:
      android_version: ${{ steps.target.outputs.android_version }}
      device: ${{ steps.target.outputs.device }}
    steps:
      - name: Resolve update target
        id: target
        env:
          ANDROID_VERSION: ${{ inputs.android_version || env.DEFAULT_ANDROID_VERSION }}
          DEVICE: ${{ inputs.device || env.DEFAULT_DEVICE }}
        shell: bash
        run: |
          if [[ ! "$ANDROID_VERSION" =~ ^[0-9]+([.][0-9]+)?$ ]]; then
            echo "Invalid Android version: $ANDROID_VERSION" >&2
            exit 1
          fi
          if [[ ! "$DEVICE" =~ ^[a-z0-9]+$ ]]; then
            echo "Invalid Google device codename: $DEVICE" >&2
            exit 1
          fi
          echo "android_version=$ANDROID_VERSION" >> "$GITHUB_OUTPUT"
          echo "device=$DEVICE" >> "$GITHUB_OUTPUT"

  extract_latest_oem_release:
    needs: configure
    runs-on: ubuntu-latest
    env:
      DEVICE: ${{ needs.configure.outputs.device }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup SSH Keys and known_hosts 
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: nikgapps
          password: ${{ secrets.AUTH }}

      - name: Pull latest Docker image
        run: docker pull ghcr.io/nikgapps/afe:latest

      - name: Extract or reuse latest OTA for ${{ needs.configure.outputs.device }}
        run: |
          mkdir workspace
          cd workspace
          docker run --rm \
          -e GITLAB_TOKEN="${{ secrets.GITLAB_TOKEN }}" \
          -e URL="$DEVICE" \
          ghcr.io/nikgapps/afe:latest /usr/src/workdir/run.sh
          cd ..

  update_sources_and_beta:
    name: Sync OEM source and prepare beta
    needs: [configure, extract_latest_oem_release]
    runs-on: macos-latest
    env:
      ANDROID_VERSION: ${{ needs.configure.outputs.android_version }}
      DEVICE: ${{ needs.configure.outputs.device }}
    steps:
       - name: Checkout
         uses: actions/checkout@main

       - name: Setup SSH Keys and known_hosts 
         uses: webfactory/ssh-agent@v0.10.0
         with:
           ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
             
       - name: Add multiple hosts to known_hosts
         run: |
           mkdir -p ~/.ssh
           ssh-keyscan frs.sourceforge.net >> ~/.ssh/known_hosts
           ssh-keyscan gitlab.com >> ~/.ssh/known_hosts  

       - name: Install Git LFS (macOS)
         run: |
           brew update
           brew install git-lfs
           git lfs install
            
       - name: Initialization and Fetching the Source Code
         run: |
           git config --global user.name "$USER_NAME"
           git config --global user.email "$EMAIL"
           git config --global http.postBuffer 157286400
           git clone --depth=1 git@github.com:nikgapps/updater.git

       - name: Install adb Android platform tools macOS
         if: runner.os == 'macOS'
         env:
           HOMEBREW_NO_AUTO_UPDATE: "1"
         run: |
           if command -v adb >/dev/null 2>&1; then
             adb version
           else
             brew install android-platform-tools
             adb version
           fi

       - uses: actions/setup-python@v7
         with:
           python-version: '3.12'

       - name: Installing Requirements
         run: |
           python3 -m pip install wheel setuptools testresources lxml
           cd updater
           pip3 install -r requirements.txt
           cd ..
            
       - name: Run Oem Apk Updates
         run: |
           cd updater
           python3 oemupdates.py -A "$ANDROID_VERSION" -O "$DEVICE"
           cd ..

       - name: Prepare beta source from synced OEM repository
         run: |
           cd updater
           python3 build_repo.py -A "$ANDROID_VERSION" -R next -O "$DEVICE"
           cd ..
