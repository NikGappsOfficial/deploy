name: NikGapps OTA Extraction
run-name: ${{ inputs.regenerate_reports && 'Regenerate reports for' || 'Extract' }} Android ${{ inputs.android_version || '17' }} OTA for ${{ inputs.device || 'kodiak' }}

on:
  schedule:
    - cron: '0 1 * * *'
  push:
    branches: [migration/ota-followups-check]
  workflow_dispatch:
    inputs:
      update_sources:
        description: Update the selected device repository and beta after extraction
        type: boolean
        default: false
      device:
        description: Google device codename
        type: string
        default: kodiak
        required: true
      android_version:
        description: Android version
        type: choice
        options: ['17']
        default: '17'
        required: true
      build:
        description: Exact build ID (leave empty to discover latest)
        type: string
        default: ''
        required: false
      baseline_namespace:
        description: GitLab namespace for dated source repositories and comparison inventories
        type: string
        default: nikgapps
        required: false
      notify_telegram:
        description: Send comparison and HTML to the monthly-report private Telegram chat
        type: boolean
        default: true
        required: true
      regenerate_reports:
        description: Regenerate GitLab upgrade metadata and Telegram reports only (no OTA extraction)
        type: boolean
        default: false
        required: true
      force_rerun:
        description: Re-extract and replace the source snapshot even if this build already succeeded
        type: boolean
        default: false
        required: true
      save_extraction:
        description: Save full TAR.XZ extraction (slow; opt in only)
        type: boolean
        default: false
        required: true

permissions:
  contents: read

concurrency:
  group: ota-source-${{ inputs.android_version || '17' }}
  cancel-in-progress: false

env:
  OPERATIONS_REPOSITORY: nikhilmenghani/nikgapps-operations
  RELEASE_REPOSITORY: nikhilmenghani/nikgapps-release
  EXECUTION_IMAGE: nikgapps-operations:extraction

jobs:
  extract:
    if: >-
      github.repository == 'NikGappsOfficial/deploy' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'schedule' && vars.NIKGAPPS_OTA_DAILY == 'true'))
    outputs:
      operations_revision: ${{ steps.operations.outputs.revision }}
      source_revision: ${{ steps.publication.outputs.source_revision || steps.resume.outputs.source_revision || steps.preflight.outputs.source_revision }}
      source_project: ${{ steps.publication.outputs.project || steps.resume.outputs.project || steps.preflight.outputs.project }}
      build: ${{ steps.preflight.outputs.build }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check private operations checkout credential
        env:
          OPERATIONS_TOKEN: ${{ secrets.G_TOKEN }}
        run: |
          if [ -z "$OPERATIONS_TOKEN" ]; then
            echo '::error::Configure G_TOKEN with read access to the private nikgapps-operations repository.'
            exit 1
          fi

      - name: Checkout deploy
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Resolve latest Operations main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ env.OPERATIONS_REPOSITORY }}
          ref: main
          token: ${{ secrets.G_TOKEN }}
          path: operations
          persist-credentials: false

      - name: Record resolved Operations commit
        id: operations
        run: |
          revision="$(git -C operations rev-parse HEAD)"
          printf 'revision=%s\n' "$revision" >> "$GITHUB_OUTPUT"
          printf 'Operations commit `%s`\n\n' "$revision" >> "$GITHUB_STEP_SUMMARY"

      - name: Check durable OTA completion receipt
        id: preflight
        env:
          G_TOKEN: ${{ secrets.G_TOKEN }}
          DEVICE: ${{ inputs.device || 'kodiak' }}
          ANDROID: ${{ inputs.android_version || '17' }}
          BUILD: ${{ inputs.build }}
          NAMESPACE: ${{ inputs.baseline_namespace || 'nikgapps' }}
          NOTIFY: ${{ inputs.notify_telegram }}
          FORCE_RERUN: ${{ inputs.force_rerun }}
          REGENERATE_REPORTS: ${{ inputs.regenerate_reports }}
        run: |
          python3 -m venv "$RUNNER_TEMP/nikgapps-preflight"
          "$RUNNER_TEMP/nikgapps-preflight/bin/python" -m pip install --require-hashes -r operations/bootstrap.lock
          args=(check --device "$DEVICE" --android "$ANDROID" --namespace "$NAMESPACE")
          if [ -n "$BUILD" ]; then args+=(--build "$BUILD"); fi
          if [ "$NOTIFY" = true ]; then args+=(--notify); fi
          if [ "$FORCE_RERUN" = true ]; then args+=(--force); fi
          if [ "$REGENERATE_REPORTS" = true ]; then args+=(--regenerate-reports); fi
          "$RUNNER_TEMP/nikgapps-preflight/bin/python" operations/tools/ota_repo.py "${args[@]}"

      - name: Complete reports for an existing source build without extraction
        id: resume
        if: inputs.regenerate_reports || (steps.preflight.outputs.completed != 'true' && steps.preflight.outputs.reusable == 'true')
        env:
          G_TOKEN: ${{ secrets.G_TOKEN }}
          DEVICE: ${{ inputs.device || 'kodiak' }}
          ANDROID: ${{ inputs.android_version || '17' }}
          BUILD: ${{ steps.preflight.outputs.build }}
          NAMESPACE: ${{ inputs.baseline_namespace || 'nikgapps' }}
          NOTIFY: ${{ inputs.notify_telegram }}
          REGENERATE_REPORTS: ${{ inputs.regenerate_reports }}
        run: |
          "$RUNNER_TEMP/nikgapps-preflight/bin/python" -m pip install --require-hashes -r operations/report.lock
          args=(finish --device "$DEVICE" --android "$ANDROID" --build "$BUILD" --namespace "$NAMESPACE" --output "$RUNNER_TEMP/nikgapps-ota/reports")
          if [ "$NOTIFY" = true ]; then args+=(--notify); fi
          if [ "$REGENERATE_REPORTS" = true ]; then args+=(--regenerate-reports); fi
          cd operations
          "$RUNNER_TEMP/nikgapps-preflight/bin/python" tools/ota_repo.py "${args[@]}"

      - name: Make room for sequential OTA extraction
        if: ${{ !inputs.regenerate_reports && steps.preflight.outputs.completed != 'true' && steps.resume.outputs.completed != 'true' }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os, shutil
          # These unused SDKs belong to the disposable GitHub-hosted runner.
          # Never apply this cleanup on a self-hosted machine.
          if os.environ.get('RUNNER_ENVIRONMENT') == 'github-hosted':
              for path in ('/usr/local/lib/android', '/usr/share/dotnet', '/opt/ghc', '/usr/local/.ghcup'):
                  shutil.rmtree(path, ignore_errors=True)
          free = shutil.disk_usage(os.environ['GITHUB_WORKSPACE']).free
          print(f'Available disk: {free / 1024**3:.1f} GiB')
          if free < 25 * 1024**3:
              raise SystemExit('At least 25 GiB free is required for the OTA, partition scratch space and output artifact.')
          PY

      - name: Set up cached Linux image builder
        if: ${{ !inputs.regenerate_reports && steps.preflight.outputs.completed != 'true' && steps.resume.outputs.completed != 'true' }}
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: Cache public toolchain dependencies only
        if: ${{ !inputs.regenerate_reports && steps.preflight.outputs.completed != 'true' && steps.resume.outputs.completed != 'true' }}
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: operations
          target: toolchain
          push: false
          cache-from: type=gha,scope=nikgapps-ota-toolchain
          cache-to: type=gha,mode=min,scope=nikgapps-ota-toolchain

      - name: Build private execution image and run engine tests
        if: ${{ !inputs.regenerate_reports && steps.preflight.outputs.completed != 'true' && steps.resume.outputs.completed != 'true' }}
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: operations
          target: execution
          load: true
          push: false
          tags: ${{ env.EXECUTION_IMAGE }}
          build-args: SOURCE_REVISION=${{ steps.operations.outputs.revision }}
          cache-from: type=gha,scope=nikgapps-ota-toolchain
          # deploy is public: never export layers containing private application code.

      - name: Discover, download, verify, extract and audit
        if: ${{ !inputs.regenerate_reports && steps.preflight.outputs.completed != 'true' && steps.resume.outputs.completed != 'true' }}
        env:
          DEVICE: ${{ inputs.device || 'kodiak' }}
          ANDROID_VERSION: ${{ inputs.android_version || '17' }}
          BUILD: ${{ steps.preflight.outputs.build }}
          SAVE_EXTRACTION: ${{ inputs.save_extraction }}
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/nikgapps-ota"
          arguments=(--root /work --device "$DEVICE" --android "$ANDROID_VERSION")
          if [ -n "$BUILD" ]; then
            arguments+=(--build "$BUILD")
          fi
          if [ "$SAVE_EXTRACTION" != 'true' ]; then
            arguments+=(--skip-archive)
          fi
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env HOME=/tmp \
            --env GITHUB_ACTIONS=true \
            --env FORCE_COLOR=1 \
            --env PYTHONUNBUFFERED=1 \
            --mount "type=bind,source=$RUNNER_TEMP/nikgapps-ota,target=/work" \
            --entrypoint python \
            "$EXECUTION_IMAGE" /app/tools/extract_workflow.py "${arguments[@]}"

      - name: Persist extracted source and inventory in GitLab
        id: checkpoint
        if: ${{ !inputs.regenerate_reports && steps.preflight.outputs.completed != 'true' && steps.resume.outputs.completed != 'true' }}
        env:
          G_TOKEN: ${{ secrets.G_TOKEN }}
          DEVICE: ${{ inputs.device || 'kodiak' }}
          ANDROID: ${{ inputs.android_version || '17' }}
          BUILD: ${{ steps.preflight.outputs.build }}
          NAMESPACE: ${{ inputs.baseline_namespace || 'nikgapps' }}
          FORCE_RERUN: ${{ inputs.force_rerun }}
        run: |
          folder=$(python3 -c 'import json,os; from pathlib import Path; p=Path(os.environ["RUNNER_TEMP"])/"nikgapps-ota/reports/run.json"; print("/work/"+json.loads(p.read_text())["extractedFolder"])')
          args=(checkpoint --device "$DEVICE" --android "$ANDROID" --build "$BUILD" --namespace "$NAMESPACE" --folder "$folder" --output /work/reports)
          if [ "$FORCE_RERUN" = true ]; then args+=(--force); fi
          docker run --rm --user "$(id -u):$(id -g)" --env HOME=/tmp --env G_TOKEN --env GITHUB_ACTIONS=true \
            --env GITHUB_REPOSITORY \
            --mount "type=bind,source=$RUNNER_TEMP/nikgapps-ota,target=/work" \
            --entrypoint python "$EXECUTION_IMAGE" /app/tools/ota_repo.py "${args[@]}"

      - name: Generate upgrade reports and notify
        id: publication
        if: ${{ !inputs.regenerate_reports && steps.preflight.outputs.completed != 'true' && steps.resume.outputs.completed != 'true' }}
        env:
          G_TOKEN: ${{ secrets.G_TOKEN }}
          DEVICE: ${{ inputs.device || 'kodiak' }}
          ANDROID: ${{ inputs.android_version || '17' }}
          BUILD: ${{ steps.preflight.outputs.build }}
          NAMESPACE: ${{ inputs.baseline_namespace || 'nikgapps' }}
          NOTIFY: ${{ inputs.notify_telegram }}
        run: |
          args=(finish --device "$DEVICE" --android "$ANDROID" --build "$BUILD" --namespace "$NAMESPACE" --output /work/reports --current-source /work/prepared-source)
          if [ "$NOTIFY" = true ]; then args+=(--notify); fi
          docker run --rm --user "$(id -u):$(id -g)" --env HOME=/tmp --env G_TOKEN --env GITHUB_ACTIONS=true \
            --env GITHUB_REPOSITORY \
            --env GITHUB_OUTPUT=/tmp/step-output \
            --mount "type=bind,source=$GITHUB_OUTPUT,target=/tmp/step-output" \
            --mount "type=bind,source=$RUNNER_TEMP/nikgapps-ota,target=/work" \
            --entrypoint python "$EXECUTION_IMAGE" /app/tools/ota_repo.py "${args[@]}"

      - name: Save extracted OTA and checksum
        if: inputs.save_extraction && !inputs.regenerate_reports && steps.preflight.outputs.completed != 'true' && steps.resume.outputs.completed != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nikgapps-ota-${{ inputs.device || 'kodiak' }}-${{ github.run_id }}
          path: ${{ runner.temp }}/nikgapps-ota/artifacts/*
          compression-level: 0
          retention-days: 3
          if-no-files-found: error

      - name: Save extraction and source-selection reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nikgapps-ota-reports-${{ github.run_id }}
          path: ${{ runner.temp }}/nikgapps-ota/reports/*
          retention-days: 7
          if-no-files-found: ignore

      - name: Summarize extraction
        if: always()
        env:
          PUBLICATION_OUTCOME: ${{ steps.publication.outcome }}
          CHECKPOINT_OUTCOME: ${{ steps.checkpoint.outcome }}
        shell: bash
        run: |
          if [ "${{ inputs.regenerate_reports }}" = true ] && [ "${{ steps.resume.outputs.completed }}" = true ]; then
            echo '## Upgrade reports regenerated from GitLab inventories. OTA download, extraction, Docker and source publication were skipped.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "${{ steps.preflight.outputs.completed }}" = true ] || [ "${{ steps.resume.outputs.completed }}" = true ]; then
            echo '## Already complete: verified GitLab source inventory, reports and completion receipt. Skipped Docker, OTA download and extraction.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          reports = Path(os.environ['RUNNER_TEMP']) / 'nikgapps-ota/reports'
          run = json.loads((reports / 'run.json').read_text()) if (reports / 'run.json').exists() else {}
          audit = json.loads((reports / 'source-selection.json').read_text()) if (reports / 'source-selection.json').exists() else {}
          lines = ['## OTA extraction', '', f"Extraction status: {run.get('status', 'not completed')}",
                   f"Source/inventory persistence: {os.environ.get('CHECKPOINT_OUTCOME', 'not completed')}",
                   f"Report generation and delivery: {os.environ.get('PUBLICATION_OUTCOME', 'not completed')}",
                   f"Build: {run.get('selected', {}).get('build', 'unavailable')}",
                   f"Source ZIP retained: {run.get('sourceZipRetained', 'extraction did not complete')}",
                   f"Selection counts: {audit.get('counts', {})}", '',
                   f"Package/file changes: {run.get('tracking', {}).get('counts', {})}",
                   f"Full extraction archived: {run.get('archiveCreated', False)}",
                   'When requested, the TAR.XZ extraction is retained for 3 days; reports for 7 days.',
                   'Source retention: latest snapshot only per dated repository; verified replacements retire superseded projects. Checkpoints resume reports without re-extraction.',
                   'GitLab completion is recorded only after successful publication and requested Telegram delivery. Package channels are unchanged.']
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as stream:
              stream.write('\n'.join(lines) + '\n')
          PY
  followups:
    needs: extract
    if: >-
      github.ref == 'refs/heads/main' &&
      needs.extract.outputs.source_revision != '' && !inputs.regenerate_reports &&
      !inputs.force_rerun && inputs.build == '' &&
      (inputs.update_sources || github.event_name == 'schedule')
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    defaults:
      run:
        shell: bash
    env:
      G_TOKEN: ${{ secrets.G_TOKEN }}
      ANDROID: ${{ inputs.android_version || '17' }}
      DEVICE: ${{ inputs.device || 'kodiak' }}
      NAMESPACE: ${{ inputs.baseline_namespace || 'nikgapps' }}
    steps:
      - name: Reuse Operations resolved by extraction
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ env.OPERATIONS_REPOSITORY }}
          ref: ${{ needs.extract.outputs.operations_revision }}
          token: ${{ secrets.G_TOKEN }}
          path: operations
          persist-credentials: false

      - name: Resolve latest Release main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ env.RELEASE_REPOSITORY }}
          ref: main
          token: ${{ secrets.G_TOKEN }}
          path: release
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Allocate an isolated follow-up workspace
        run: printf 'WORK=%s/ota-followups\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Compare durable completion checkpoints
        id: followup
        env:
          SOURCE_PROJECT: ${{ needs.extract.outputs.source_project }}
          SOURCE_REVISION: ${{ needs.extract.outputs.source_revision }}
          BUILD: ${{ needs.extract.outputs.build }}
          OVERLAY_PROJECT: ${{ vars.NIKGAPPS_OTA_OVERLAY_PROJECT }}
          OVERLAY_BRANCH: ${{ vars.NIKGAPPS_OTA_OVERLAY_BRANCH }}
          OPERATIONS_REVISION: ${{ needs.extract.outputs.operations_revision }}
        run: |
          python -m pip install --require-hashes -r operations/bootstrap.lock
          release_revision="$(git -C release rev-parse HEAD)"
          release_tree="$(git -C release rev-parse HEAD:nikgapps_release)"
          test "$(git -C operations rev-parse HEAD)" = "$OPERATIONS_REVISION"
          printf 'Operations %s\n\nRelease %s\n\nOTA source %s @ %s\n\n' \
            "$OPERATIONS_REVISION" "$release_revision" "$SOURCE_PROJECT" "$SOURCE_REVISION" >> "$GITHUB_STEP_SUMMARY"
          PYTHONPATH=operations/src python -m nikgapps_ops.ota_followups probe \
            --work "$WORK" --namespace "$NAMESPACE" --android "$ANDROID" --device "$DEVICE" \
            --source-project "$SOURCE_PROJECT" --source-revision "$SOURCE_REVISION" --build "$BUILD" \
            --operations-revision "$OPERATIONS_REVISION" --release-revision "$release_revision" --release-input-tree "$release_tree" \
            --overlay-project "$OVERLAY_PROJECT" --overlay-branch "$OVERLAY_BRANCH"
          if grep -qx 'beta_needed=false' "$GITHUB_OUTPUT"; then
            echo 'Device and beta match their completed inputs. Skipped SDK setup and file transfers.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Update or recover the device source and resolve beta work
        id: device
        if: steps.followup.outputs.beta_needed == 'true'
        run: |
          python -m pip install PyYAML==6.0.3
          PYTHONPATH=operations/src python -m nikgapps_ops.ota_followups device --work "$WORK"
          grep '^device_revision=' "$GITHUB_OUTPUT" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Java for a changed beta
        if: steps.device.outputs.beta_needed == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install the resolved Release package
        if: steps.device.outputs.beta_needed == 'true'
        run: python -m pip install ./release

      - name: Install the reviewed Android tools
        id: sdk
        if: steps.device.outputs.beta_needed == 'true'
        run: |
          sdk="$WORK/android-sdk"
          archive="$WORK/commandlinetools.zip"
          mkdir -p "$sdk/cmdline-tools"
          curl --fail --silent --show-error --location --retry 3 --proto '=https' \
            'https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip' --output "$archive"
          printf '%s  %s\n' '4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583' "$archive" | sha256sum --check -
          unzip -q "$archive" -d "$sdk/cmdline-tools"
          mv "$sdk/cmdline-tools/cmdline-tools" "$sdk/cmdline-tools/latest"
          sdkmanager="$sdk/cmdline-tools/latest/bin/sdkmanager"
          "$sdkmanager" --sdk_root="$sdk" --install 'platforms;android-37.0' 'build-tools;36.0.0' < <(yes)
          test -f "$sdk/platforms/android-37.0/android.jar"
          tools="$sdk/build-tools/36.0.0"
          printf '%s  %s\n' '3716d9311e55d2b0918a2fd9d54ba9e406c5f6abeea700b287f11259bc163dec' "$tools/lib/apksigner.jar" | sha256sum --check -
          printf 'ANDROID_HOME=%s\nANDROID_SDK_ROOT=%s\n' "$sdk" "$sdk" >> "$GITHUB_ENV"
          echo "$tools" >> "$GITHUB_PATH"
          printf 'directory=%s\n' "$tools" >> "$GITHUB_OUTPUT"

      - name: Update beta from stable and the verified device revision
        if: steps.device.outputs.beta_needed == 'true'
        env:
          TOOLS: ${{ steps.sdk.outputs.directory }}
        run: |
          PYTHONPATH=operations/src python -m nikgapps_ops.ota_followups beta --work "$WORK" \
            --aapt2 "$TOOLS/aapt2" --apksigner "$TOOLS/lib/apksigner.jar"
          grep '^beta_revision=' "$GITHUB_OUTPUT" >> "$GITHUB_STEP_SUMMARY"

  verify-followups:
    if: github.repository == 'NikGappsOfficial/deploy' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ env.OPERATIONS_REPOSITORY }}
          ref: main
          token: ${{ secrets.G_TOKEN }}
          path: operations
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ env.RELEASE_REPOSITORY }}
          ref: main
          token: ${{ secrets.G_TOKEN }}
          path: release
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Test resume and read the completed November OTA handoff
        env:
          G_TOKEN: ${{ secrets.G_TOKEN }}
          PYTHONPATH: operations/src
        run: |
          python -m pip install --require-hashes -r operations/bootstrap.lock
          python -m unittest discover -s operations/tests -p test_ota_followups.py -v
          operations_revision="$(git -C operations rev-parse HEAD)"
          release_revision="$(git -C release rev-parse HEAD)"
          release_tree="$(git -C release rev-parse HEAD:nikgapps_release)"
          printf 'Operations %s\n\nRelease %s\n\n' "$operations_revision" "$release_revision" >> "$GITHUB_STEP_SUMMARY"
          python -m nikgapps_ops.ota_followups probe --work "$RUNNER_TEMP/followups-probe" \
            --namespace nikgapps --android 17 --device kodiak --build CP4A.261105.040.D1 \
            --source-project nikgapps/17_kodiak_261105 --source-revision 2de2cc51106d8a8f115a2af3090f4967a19e80b0 \
            --operations-revision "$operations_revision" --release-revision "$release_revision" --release-input-tree "$release_tree" \
            --overlay-project nikgapps/17_beta_migration_test --overlay-branch overlay-source
