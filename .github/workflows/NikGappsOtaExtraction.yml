name: NikGapps OTA Extraction
run-name: ${{ inputs.regenerate_reports && 'Regenerate reports for' || 'Extract' }} Android ${{ inputs.android_version }} OTA for ${{ inputs.device }}

on:
  workflow_dispatch:
    inputs:
      device:
        description: Google device codename
        type: string
        default: kodiak
        required: true
      android_version:
        description: Android version
        type: choice
        options: ['17']
        default: '17'
        required: true
      build:
        description: Exact build ID (leave empty to discover latest)
        type: string
        default: ''
        required: false
      baseline_namespace:
        description: GitLab namespace for dated source repositories and comparison inventories
        type: string
        default: nikgapps
        required: false
      notify_telegram:
        description: Send comparison and HTML to the monthly-report private Telegram chat
        type: boolean
        default: true
        required: true
      regenerate_reports:
        description: Regenerate GitLab upgrade metadata and Telegram reports only (no OTA extraction)
        type: boolean
        default: false
        required: true
      force_rerun:
        description: Re-extract and republish this build even if it already succeeded
        type: boolean
        default: false
        required: true
      save_extraction:
        description: Save full TAR.XZ extraction (slow; opt in only)
        type: boolean
        default: false
        required: true

permissions:
  contents: read

concurrency:
  group: ota-extraction-${{ inputs.android_version }}-${{ inputs.device }}
  cancel-in-progress: false

env:
  OPERATIONS_REPOSITORY: nikhilmenghani/nikgapps-operations
  OPERATIONS_REVISION: 5cabaee37db3fb846f163d65f47b73b7c8168f21
  EXECUTION_IMAGE: nikgapps-operations:extraction

jobs:
  extract:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check private operations checkout credential
        env:
          OPERATIONS_TOKEN: ${{ secrets.G_TOKEN }}
        run: |
          if [ -z "$OPERATIONS_TOKEN" ]; then
            echo '::error::Configure G_TOKEN with read access to the private nikgapps-operations repository.'
            exit 1
          fi

      - name: Checkout deploy
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Checkout tested operations revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ env.OPERATIONS_REPOSITORY }}
          ref: ${{ env.OPERATIONS_REVISION }}
          token: ${{ secrets.G_TOKEN }}
          path: operations
          persist-credentials: false

      - name: Check durable OTA completion receipt
        id: preflight
        env:
          G_TOKEN: ${{ secrets.G_TOKEN }}
          DEVICE: ${{ inputs.device }}
          ANDROID: ${{ inputs.android_version }}
          BUILD: ${{ inputs.build }}
          NAMESPACE: ${{ inputs.baseline_namespace || 'nikgapps' }}
          NOTIFY: ${{ inputs.notify_telegram }}
          FORCE_RERUN: ${{ inputs.force_rerun }}
          REGENERATE_REPORTS: ${{ inputs.regenerate_reports }}
        run: |
          python3 -m venv "$RUNNER_TEMP/nikgapps-preflight"
          "$RUNNER_TEMP/nikgapps-preflight/bin/python" -m pip install --require-hashes -r operations/bootstrap.lock
          args=(check --device "$DEVICE" --android "$ANDROID" --namespace "$NAMESPACE")
          if [ -n "$BUILD" ]; then args+=(--build "$BUILD"); fi
          if [ "$NOTIFY" = true ]; then args+=(--notify); fi
          if [ "$FORCE_RERUN" = true ]; then args+=(--force); fi
          if [ "$REGENERATE_REPORTS" = true ]; then args+=(--regenerate-reports); fi
          "$RUNNER_TEMP/nikgapps-preflight/bin/python" operations/tools/ota_repo.py "${args[@]}"

      - name: Complete reports for an existing source build without extraction
        id: resume
        if: inputs.regenerate_reports || (steps.preflight.outputs.completed != 'true' && steps.preflight.outputs.reusable == 'true')
        env:
          G_TOKEN: ${{ secrets.G_TOKEN }}
          DEVICE: ${{ inputs.device }}
          ANDROID: ${{ inputs.android_version }}
          BUILD: ${{ steps.preflight.outputs.build }}
          NAMESPACE: ${{ inputs.baseline_namespace || 'nikgapps' }}
          NOTIFY: ${{ inputs.notify_telegram }}
          REGENERATE_REPORTS: ${{ inputs.regenerate_reports }}
        run: |
          "$RUNNER_TEMP/nikgapps-preflight/bin/python" -m pip install --require-hashes -r operations/report.lock
          args=(finish --device "$DEVICE" --android "$ANDROID" --build "$BUILD" --namespace "$NAMESPACE" --output "$RUNNER_TEMP/nikgapps-ota/reports")
          if [ "$NOTIFY" = true ]; then args+=(--notify); fi
          if [ "$REGENERATE_REPORTS" = true ]; then args+=(--regenerate-reports); fi
          cd operations
          "$RUNNER_TEMP/nikgapps-preflight/bin/python" tools/ota_repo.py "${args[@]}"

      - name: Make room for sequential OTA extraction
        if: ${{ !inputs.regenerate_reports && steps.preflight.outputs.completed != 'true' && steps.resume.outputs.completed != 'true' }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os, shutil
          # These unused SDKs belong to the disposable GitHub-hosted runner.
          # Never apply this cleanup on a self-hosted machine.
          if os.environ.get('RUNNER_ENVIRONMENT') == 'github-hosted':
              for path in ('/usr/local/lib/android', '/usr/share/dotnet', '/opt/ghc', '/usr/local/.ghcup'):
                  shutil.rmtree(path, ignore_errors=True)
          free = shutil.disk_usage(os.environ['GITHUB_WORKSPACE']).free
          print(f'Available disk: {free / 1024**3:.1f} GiB')
          if free < 25 * 1024**3:
              raise SystemExit('At least 25 GiB free is required for the OTA, partition scratch space and output artifact.')
          PY

      - name: Set up cached Linux image builder
        if: ${{ !inputs.regenerate_reports && steps.preflight.outputs.completed != 'true' && steps.resume.outputs.completed != 'true' }}
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Cache public toolchain dependencies only
        if: ${{ !inputs.regenerate_reports && steps.preflight.outputs.completed != 'true' && steps.resume.outputs.completed != 'true' }}
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: operations
          target: toolchain
          push: false
          cache-from: type=gha,scope=nikgapps-ota-toolchain
          cache-to: type=gha,mode=min,scope=nikgapps-ota-toolchain

      - name: Build private execution image and run engine tests
        if: ${{ !inputs.regenerate_reports && steps.preflight.outputs.completed != 'true' && steps.resume.outputs.completed != 'true' }}
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: operations
          target: execution
          load: true
          push: false
          tags: ${{ env.EXECUTION_IMAGE }}
          build-args: SOURCE_REVISION=${{ env.OPERATIONS_REVISION }}
          cache-from: type=gha,scope=nikgapps-ota-toolchain
          # deploy is public: never export layers containing private application code.

      - name: Discover, download, verify, extract and audit
        if: ${{ !inputs.regenerate_reports && steps.preflight.outputs.completed != 'true' && steps.resume.outputs.completed != 'true' }}
        env:
          DEVICE: ${{ inputs.device }}
          ANDROID_VERSION: ${{ inputs.android_version }}
          BUILD: ${{ steps.preflight.outputs.build }}
          BASELINE_NAMESPACE: ${{ inputs.baseline_namespace || 'nikgapps' }}
          NOTIFY_TELEGRAM: ${{ inputs.notify_telegram }}
          SAVE_EXTRACTION: ${{ inputs.save_extraction }}
          G_TOKEN: ${{ secrets.G_TOKEN }}
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/nikgapps-ota"
          arguments=(--root /work --device "$DEVICE" --android "$ANDROID_VERSION")
          if [ -n "$BUILD" ]; then
            arguments+=(--build "$BUILD")
          fi
          if [ -n "$BASELINE_NAMESPACE" ]; then
            arguments+=(--baseline-namespace "$BASELINE_NAMESPACE")
          fi
          if [ "$NOTIFY_TELEGRAM" = 'true' ]; then
            arguments+=(--notify)
          fi
          if [ "$SAVE_EXTRACTION" != 'true' ]; then
            arguments+=(--skip-archive)
          fi
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env HOME=/tmp \
            --env GITHUB_ACTIONS=true \
            --env FORCE_COLOR=1 \
            --env PYTHONUNBUFFERED=1 \
            --env G_TOKEN \
            --mount "type=bind,source=$RUNNER_TEMP/nikgapps-ota,target=/work" \
            --entrypoint python \
            "$EXECUTION_IMAGE" /app/tools/extract_workflow.py "${arguments[@]}"

      - name: Publish source and reports and record verified completion
        id: publication
        if: ${{ !inputs.regenerate_reports && steps.preflight.outputs.completed != 'true' && steps.resume.outputs.completed != 'true' }}
        env:
          G_TOKEN: ${{ secrets.G_TOKEN }}
          DEVICE: ${{ inputs.device }}
          ANDROID: ${{ inputs.android_version }}
          BUILD: ${{ steps.preflight.outputs.build }}
          NAMESPACE: ${{ inputs.baseline_namespace || 'nikgapps' }}
          NOTIFY: ${{ inputs.notify_telegram }}
          FORCE_RERUN: ${{ inputs.force_rerun }}
        run: |
          folder=$(python3 -c 'import json,os; from pathlib import Path; p=Path(os.environ["RUNNER_TEMP"])/"nikgapps-ota/reports/run.json"; print("/work/"+json.loads(p.read_text())["extractedFolder"])')
          args=(publish --device "$DEVICE" --android "$ANDROID" --build "$BUILD" --namespace "$NAMESPACE" --folder "$folder" --output /work/reports)
          if [ "$NOTIFY" = true ]; then args+=(--notify); fi
          if [ "$FORCE_RERUN" = true ]; then args+=(--force); fi
          docker run --rm --user "$(id -u):$(id -g)" --env HOME=/tmp --env G_TOKEN --env GITHUB_ACTIONS=true \
            --mount "type=bind,source=$RUNNER_TEMP/nikgapps-ota,target=/work" \
            --entrypoint python "$EXECUTION_IMAGE" /app/tools/ota_repo.py "${args[@]}"

      - name: Save extracted OTA and checksum
        if: inputs.save_extraction && !inputs.regenerate_reports && steps.preflight.outputs.completed != 'true' && steps.resume.outputs.completed != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nikgapps-ota-${{ inputs.device }}-${{ github.run_id }}
          path: ${{ runner.temp }}/nikgapps-ota/artifacts/*
          compression-level: 0
          retention-days: 3
          if-no-files-found: error

      - name: Save extraction and source-selection reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nikgapps-ota-reports-${{ github.run_id }}
          path: ${{ runner.temp }}/nikgapps-ota/reports/*
          retention-days: 7
          if-no-files-found: ignore

      - name: Summarize extraction
        if: always()
        env:
          PUBLICATION_OUTCOME: ${{ steps.publication.outcome }}
        shell: bash
        run: |
          if [ "${{ inputs.regenerate_reports }}" = true ] && [ "${{ steps.resume.outputs.completed }}" = true ]; then
            echo '## Upgrade reports regenerated from GitLab inventories. OTA download, extraction, Docker and source publication were skipped.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "${{ steps.preflight.outputs.completed }}" = true ] || [ "${{ steps.resume.outputs.completed }}" = true ]; then
            echo '## Already complete: verified GitLab source inventory, reports and completion receipt. Skipped Docker, OTA download and extraction.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          reports = Path(os.environ['RUNNER_TEMP']) / 'nikgapps-ota/reports'
          run = json.loads((reports / 'run.json').read_text()) if (reports / 'run.json').exists() else {}
          audit = json.loads((reports / 'source-selection.json').read_text()) if (reports / 'source-selection.json').exists() else {}
          lines = ['## OTA extraction', '', f"Extraction status: {run.get('status', 'not completed')}",
                   f"GitLab publication: {os.environ.get('PUBLICATION_OUTCOME', 'not completed')}",
                   f"Build: {run.get('selected', {}).get('build', 'unavailable')}",
                   f"Source ZIP retained: {run.get('sourceZipRetained', 'extraction did not complete')}",
                   f"Selection counts: {audit.get('counts', {})}", '',
                   f"Package/file changes: {run.get('tracking', {}).get('counts', {})}",
                   f"Full extraction archived: {run.get('archiveCreated', False)}",
                   'When requested, the TAR.XZ extraction is retained for 3 days; reports for 7 days.',
                   'GitLab completion is recorded only after successful publication and requested Telegram delivery. Package channels are unchanged.']
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as stream:
              stream.write('\n'.join(lines) + '\n')
          PY
