name: Publish Stable Package Registry

on:
  workflow_dispatch:
    inputs:
      android_version:
        description: Android version to publish
        type: string
        required: false
        default: '17'
  workflow_call:
    inputs:
      android_version:
        description: Android version to publish
        type: string
        required: true

permissions:
  contents: read

concurrency:
  # All versions commit shared registry metadata, so serialize publication.
  group: stable-registry-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      ANDROID_VERSION: ${{ inputs.android_version || '17' }}
      CATALOG_PROJECT: ${{ vars.GITLAB_CATALOG_PROJECT_ID || '85036487' }}
      G_TOKEN: ${{ secrets.G_TOKEN }}
      GIT_TERMINAL_PROMPT: '0'
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: credential.helper
      GIT_CONFIG_VALUE_0: ''
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install 'PyYAML~=6.0.3' 'python-dotenv~=1.2.4'
      - name: Resolve reviewed release credential loader
        id: engine
        run: |
          python - <<'PY'
          import os, yaml
          from pathlib import Path
          workflow = yaml.load(Path('.github/workflows/NikGappsAndroid17Release.yml').read_text(), Loader=yaml.BaseLoader)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f"commit={workflow['env']['RELEASE_COMMIT']}\n")
          PY
      - uses: actions/checkout@v7
        with:
          repository: nikhilmenghani/nikgapps-release
          ref: ${{ steps.engine.outputs.commit }}
          token: ${{ secrets.G_TOKEN }}
          path: release-engine
          persist-credentials: false
      - name: Load stable publication credentials from myenv
        run: python release-engine/scripts/environment.py
      - name: Validate target and credentials
        shell: bash
        run: |
          if [[ ! "$ANDROID_VERSION" =~ ^[0-9]+([.][0-9]+)?$ ]]; then
            echo "Invalid Android version: $ANDROID_VERSION" >&2
            exit 1
          fi
          test -n "$GITLAB_TOKEN"
          test -n "$PACKAGES_GITHUB_TOKEN"
      - name: Configure HTTPS repository access and LFS
        run: |
          chmod +x "$GITHUB_WORKSPACE/release-engine/scripts/git_askpass.py"
          echo "GIT_ASKPASS=$GITHUB_WORKSPACE/release-engine/scripts/git_askpass.py" >> "$GITHUB_ENV"
          git lfs install
      - name: Clone project and stable sources
        run: |
          git clone --depth=1 https://github.com/nikgapps/project.git project
          git clone --depth=1 "https://gitlab.com/nikgapps/${ANDROID_VERSION}_stable.git" "${ANDROID_VERSION}_stable"
          git clone --depth=1 "https://gitlab.com/nikgapps/overlays_${ANDROID_VERSION}.git" "overlays_${ANDROID_VERSION}"

      - name: Install publisher dependencies
        shell: bash
        run: |
          python -m pip install -r project/requirements.txt 'nikassets~=0.17'
          python -m pip install --no-deps -e ./project

      - name: Locate build assets
        id: assets
        shell: bash
        run: |
          AAPT2="$(find "$ANDROID_HOME/build-tools" -type f -name aapt2 | sort -V | tail -n 1)"
          if [[ -z "$AAPT2" || ! -x "$AAPT2" ]]; then
            echo "Android SDK build-tools/aapt2 is unavailable" >&2
            exit 1
          fi
          BUSYBOX="$(python -c 'from importlib.resources import files; print(files("nikassets").joinpath("helper/assets/busybox"))')"
          if [[ ! -f "$BUSYBOX" ]]; then
            echo "nikassets busybox is unavailable" >&2
            exit 1
          fi
          echo "aapt2=$AAPT2" >> "$GITHUB_OUTPUT"
          echo "busybox=$BUSYBOX" >> "$GITHUB_OUTPUT"

      - name: Verify Android configuration
        run: python -m unittest discover -s tests_registry -v
        working-directory: project

      - name: Publish stable packages and automatic config revisions
        shell: bash
        run: |
          python -m nikgapps_registry sync \
            --source "${ANDROID_VERSION}_stable" \
            --overlays "overlays_${ANDROID_VERSION}" \
            --work "${ANDROID_VERSION}_REGISTRY_RELEASE" \
            --project "$CATALOG_PROJECT" \
            --android-version "$ANDROID_VERSION" \
            --arch arm64-v8a \
            --channel stable \
            --aapt2 "${{ steps.assets.outputs.aapt2 }}" \
            --busybox "${{ steps.assets.outputs.busybox }}" \
            --builder-assets project/NikGapps/helper/assets \
            --verbose

      - name: Mirror stable packages and metadata to GitHub
        working-directory: release-engine
        run: python -m scripts.github_mirror --builder ../project

      - name: Upload publication manifest
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: registry-publication-${{ env.ANDROID_VERSION }}
          path: |
            release-engine/.work/github-mirror/mirror-receipt.json
            ${{ env.ANDROID_VERSION }}_REGISTRY_RELEASE/published-urls.json
            ${{ env.ANDROID_VERSION }}_REGISTRY_RELEASE/metadata/config-templates.json
            ${{ env.ANDROID_VERSION }}_REGISTRY_RELEASE/metadata/releases/index.json
          if-no-files-found: ignore
