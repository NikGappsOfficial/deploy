name: Publish Stable Package Registry

on:
  workflow_dispatch:
    inputs:
      android_version:
        description: Android version to publish
        type: string
        required: false
        default: '17'
  workflow_call:
    inputs:
      android_version:
        description: Android version to publish
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: stable-registry-${{ inputs.android_version || '17' }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      ANDROID_VERSION: ${{ inputs.android_version || '17' }}
      CATALOG_PROJECT: ${{ vars.GITLAB_CATALOG_PROJECT_ID || '85036487' }}
      GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
    steps:
      - name: Validate target and credentials
        shell: bash
        run: |
          if [[ ! "$ANDROID_VERSION" =~ ^[0-9]+([.][0-9]+)?$ ]]; then
            echo "Invalid Android version: $ANDROID_VERSION" >&2
            exit 1
          fi
          if [[ -z "$GITLAB_TOKEN" ]]; then
            echo "GITLAB_TOKEN is required" >&2
            exit 1
          fi

      - name: Configure repository access
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Trust Git hosts and enable LFS
        shell: bash
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan github.com gitlab.com >> ~/.ssh/known_hosts
          git lfs install

      - name: Clone project and stable sources
        shell: bash
        run: |
          git clone --depth=1 git@github.com:nikgapps/project.git project
          git clone --depth=1 "git@gitlab.com:nikgapps/${ANDROID_VERSION}_stable.git" "${ANDROID_VERSION}_stable"
          git clone --depth=1 "git@gitlab.com:nikgapps/overlays_${ANDROID_VERSION}.git" "overlays_${ANDROID_VERSION}"

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install publisher dependencies
        shell: bash
        run: |
          python -m pip install -r project/requirements.txt 'nikassets~=0.17'
          python -m pip install --no-deps -e ./project

      - name: Locate build assets
        id: assets
        shell: bash
        run: |
          AAPT2="$(find "$ANDROID_HOME/build-tools" -type f -name aapt2 | sort -V | tail -n 1)"
          if [[ -z "$AAPT2" || ! -x "$AAPT2" ]]; then
            echo "Android SDK build-tools/aapt2 is unavailable" >&2
            exit 1
          fi
          BUSYBOX="$(python -c 'from importlib.resources import files; print(files("nikassets").joinpath("helper/assets/busybox"))')"
          if [[ ! -f "$BUSYBOX" ]]; then
            echo "nikassets busybox is unavailable" >&2
            exit 1
          fi
          echo "aapt2=$AAPT2" >> "$GITHUB_OUTPUT"
          echo "busybox=$BUSYBOX" >> "$GITHUB_OUTPUT"

      - name: Verify Android configuration
        run: python -m unittest tests_registry.test_android17_config -v
        working-directory: project

      - name: Publish incremental stable packages and metadata
        shell: bash
        run: |
          python -m nikgapps_registry sync \
            --source "${ANDROID_VERSION}_stable" \
            --overlays "overlays_${ANDROID_VERSION}" \
            --work "${ANDROID_VERSION}_REGISTRY_RELEASE" \
            --project "$CATALOG_PROJECT" \
            --android-version "$ANDROID_VERSION" \
            --arch arm64-v8a \
            --channel stable \
            --aapt2 "${{ steps.assets.outputs.aapt2 }}" \
            --busybox "${{ steps.assets.outputs.busybox }}" \
            --builder-assets project/NikGapps/helper/assets \
            --verbose

      - name: Upload publication manifest
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: registry-publication-${{ env.ANDROID_VERSION }}
          path: ${{ env.ANDROID_VERSION }}_REGISTRY_RELEASE/published-urls.json
          if-no-files-found: ignore
