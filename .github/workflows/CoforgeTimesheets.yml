name: Coforge Timesheets Workflow

on:
  schedule:
  # 13:00 UTC on the first day of each month (09:00 Toronto during DST).
  - cron: "0 13 1 * *"
  workflow_dispatch:
    inputs:
      target_month:
        description: "Month to generate (YYYY-MM); blank uses previous month"
        required: false
        type: string

env:
  auth: ${{ secrets.AUTH }}
  deploy_auth: ${{ secrets.DEPLOY_AUTH }}
  USER_NAME: ${{ secrets.USER_NAME }}
  EMAIL: ${{ secrets.EMAIL }}

jobs:
  coforge-timesheets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TARGET_MONTH: ${{ inputs.target_month || '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup SSH Keys and known_hosts 
        uses: webfactory/ssh-agent@v0.10.0
        with:
            ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
               
      - name: Add multiple hosts to known_hosts
        run: |
          ssh-keyscan frs.sourceforge.net >> ~/.ssh/known_hosts
          ssh-keyscan gitlab.com >> ~/.ssh/known_hosts 

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
            python-version: '3.12'
    
      - name: Initialization and Fetching the Source Code
        run: |
          git config --global user.name "$USER_NAME"
          git config --global user.email "$EMAIL"
          git config --global http.postBuffer 1048576000
          git clone --depth=1 git@github.com:nikhilmenghani/cron.git

      - name: Installing Requirements
        run: |
          python3 -m pip install wheel setuptools testresources
          cd cron
          pip3 install -r requirements.txt
          cd ..

      - name: Generate PDFs and send through Telegram
        run: |
          cd cron
          python3 run_monthly_documents.py --target-month "$TARGET_MONTH"

      # - name: Upload generated PDFs as workflow artifact
      #   if: always()
