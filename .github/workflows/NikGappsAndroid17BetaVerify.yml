name: Verify Android 17 stable-seeded beta

on:
  push:
    branches: [migration/android17-beta-source-verify]
  workflow_dispatch:
    inputs:
      operations_revision:
        description: Exact operations commit
        type: string
        required: true
      stable_revision:
        description: Exact 17_stable commit
        type: string
        required: true
      kodiak_revision:
        description: Exact 17_kodiak commit
        type: string
        required: true
      beta_revision:
        description: Exact current 17_beta commit
        type: string
        required: true
      overlay_project:
        description: GitLab overlay-source project path, including namespace
        type: string
        required: true
      overlay_source_revision:
        description: Exact overlay-source commit
        type: string
        required: true
      firmware_project:
        description: Dated Kodiak firmware project path from the OEM sync receipt
        type: string
        required: true
      firmware_revision:
        description: Exact firmware commit from the OEM sync receipt
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: android17-beta-verify-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository == 'NikGappsOfficial/deploy'
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Resolve approved inputs
        id: pins
        shell: bash
        run: |
          mkdir "$RUNNER_TEMP/android17-beta-verify"
          python scripts/verify_android17_beta.py pins \
            --workspace "$RUNNER_TEMP/android17-beta-verify" \
            --event "$GITHUB_EVENT_PATH" --event-name "$GITHUB_EVENT_NAME" \
            --config .github/validation/android17-beta-source-verify.json
      - name: Check out exact operations code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: nikhilmenghani/nikgapps-operations
          ref: ${{ steps.pins.outputs.operations_revision }}
          token: ${{ secrets.MIGRATION_CHECKOUT_TOKEN || secrets.G_TOKEN }}
          path: operations
          persist-credentials: false
      - name: Resolve release main once
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: nikhilmenghani/nikgapps-release
          ref: main
          token: ${{ secrets.MIGRATION_CHECKOUT_TOKEN || secrets.G_TOKEN }}
          path: release
          persist-credentials: false
      - name: Record code provenance and install engines
        id: code
        env:
          OPERATIONS_REVISION: ${{ steps.pins.outputs.operations_revision }}
        shell: bash
        run: |
          test "$(git -C operations rev-parse HEAD)" = "$OPERATIONS_REVISION"
          release_revision="$(git -C release rev-parse HEAD)"
          printf 'release_revision=%s\n' "$release_revision" >> "$GITHUB_OUTPUT"
          printf 'Operations: `%s`\n\nRelease: `%s`\n\n' "$OPERATIONS_REVISION" "$release_revision" >> "$GITHUB_STEP_SUMMARY"
          exec 3>&1
          trap 'echo "::error::Failed to install the pinned operations or resolved release engine." >&3' ERR
          exec >"$RUNNER_TEMP/android17-beta-verify/install.log" 2>&1
          python -m pip install ./release 'python-dotenv~=1.2.4'
          python -m pip install --no-deps ./operations
          python -I -c "from importlib.util import find_spec; assert find_spec('NikGapps') is None"
          python -m unittest discover -s tests -p test_android17_beta_verify.py -v
      - name: Prepare runner disk and inspect Android build tools
        id: sdk
        shell: bash
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/lib/android/sdk/ndk
          sdk_root="$RUNNER_TEMP/android17-beta-verify/android-sdk"
          archive="$RUNNER_TEMP/android17-beta-verify/commandlinetools-linux.zip"
          mkdir -p "$sdk_root/cmdline-tools"
          curl --fail --silent --show-error --location --retry 3 --proto '=https' \
            'https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip' --output "$archive"
          printf '%s  %s\n' '4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583' "$archive" | sha256sum --check -
          unzip -q "$archive" -d "$sdk_root/cmdline-tools"
          mv "$sdk_root/cmdline-tools/cmdline-tools" "$sdk_root/cmdline-tools/latest"
          rm -- "$archive"
          sdkmanager="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          "$sdkmanager" --sdk_root="$sdk_root" --install 'platforms;android-37.0' 'build-tools;37.0.0' < <(yes)
          test -f "$sdk_root/platforms/android-37.0/android.jar"
          df -h "$RUNNER_TEMP"
          sdk_build_tools="$sdk_root/build-tools/37.0.0"
          test -x "$sdk_build_tools/zipalign"
          java -version
          "$sdk_build_tools/aapt2" version
          java -jar "$sdk_build_tools/lib/apksigner.jar" version
          printf 'ANDROID_HOME=%s\nANDROID_SDK_ROOT=%s\n' "$sdk_root" "$sdk_root" >> "$GITHUB_ENV"
          echo "$sdk_build_tools" >> "$GITHUB_PATH"
          printf 'directory=%s\n' "$sdk_build_tools" >> "$GITHUB_OUTPUT"
      - name: Fetch exact GitLab inputs with read access
        env:
          GITLAB_READ_TOKEN: ${{ secrets.GITLAB_SOURCE_READ_TOKEN || secrets.NIKGAPPS_GITLAB_READ_TOKEN }}
          G_TOKEN: ${{ secrets.G_TOKEN }}
          LEGACY_GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        shell: bash
        run: |
          python scripts/verify_android17_beta.py fetch --workspace "$RUNNER_TEMP/android17-beta-verify"
      - name: Build and read back stable-seeded beta
        env:
          RELEASE_REVISION: ${{ steps.code.outputs.release_revision }}
          SDK_BUILD_TOOLS: ${{ steps.sdk.outputs.directory }}
        shell: bash
        run: |
          python scripts/verify_android17_beta.py verify \
            --workspace "$RUNNER_TEMP/android17-beta-verify" \
            --release-revision "$RELEASE_REVISION" --sdk-build-tools "$SDK_BUILD_TOOLS"
