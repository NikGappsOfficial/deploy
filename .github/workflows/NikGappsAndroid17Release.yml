name: NikGapps Android 17 Release

on:
  workflow_dispatch:
    inputs:
      stable_commit:
        description: Optional full 17_stable commit SHA (default is latest main)
        type: string
        required: false
      overlay_source_commit:
        description: Optional full overlays_17_source commit SHA (default is latest main)
        type: string
        required: false
      packages:
        description: Package groups to release
        type: string
        default: core,corego,basic,omni,stock,full,go,addonsets,addons,removeotascripts,debloater
        required: true
      verify_only:
        description: Build and validate everything locally on the runner without publishing
        type: boolean
        default: false
        required: true

permissions:
  contents: read

concurrency:
  # A release shares the publication lock across all Android versions.
  group: ${{ inputs.verify_only && 'android17-release-preview' || 'stable-registry-publication' }}
  cancel-in-progress: false

env:
  RELEASE_REPOSITORY: nikhilmenghani/nikgapps-release
  RELEASE_REF: main
  ANDROID_VERSION: '17'
  ENVIRONMENT_TYPE: production
  RELEASE_TYPE: stable
  PACKAGE_SOURCE: registry
  PACKAGE_CHANNEL: stable
  G_TOKEN: ${{ !inputs.verify_only && secrets.G_TOKEN || '' }}
  CATALOG_PROJECT: ${{ vars.GITLAB_CATALOG_PROJECT_ID || '85036487' }}
  SF_USER: ${{ vars.SF_USER || 'nikhilmenghani' }}
  GIT_TERMINAL_PROMPT: '0'
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: credential.helper
  GIT_CONFIG_VALUE_0: ''

jobs:
  release:
    if: github.repository == 'NikGappsOfficial/deploy' && (github.ref == 'refs/heads/main' || inputs.verify_only)
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out deployment adapters
        uses: actions/checkout@v7
        with:
          path: deploy
          persist-credentials: false

      - name: Check GitHub bootstrap credential
        if: ${{ !inputs.verify_only }}
        run: |
          if [ -z "$G_TOKEN" ]; then
            echo '::error::G_TOKEN must read nikgapps-release and myenv and push the tracker and website.'
            exit 1
          fi

      - name: Check out latest release engine
        uses: actions/checkout@v7
        with:
          repository: ${{ env.RELEASE_REPOSITORY }}
          ref: ${{ env.RELEASE_REF }}
          token: ${{ secrets.G_TOKEN }}
          path: release
          persist-credentials: false

      - name: Record resolved release engine commit
        run: |
          revision="$(git -C release rev-parse HEAD)"
          echo "RELEASE_COMMIT=$revision" | tee -a "$GITHUB_ENV"

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install release dependencies and verify tooling
        working-directory: release
        run: |
          python -m pip install . 'python-dotenv~=1.2.4'
          python -m unittest discover -s tests -v

      - name: Validate release selection
        id: selection
        working-directory: release
        env:
          REQUESTED_PACKAGES: ${{ inputs.packages }}
        run: |
          python - <<'PY'
          import os
          from nikgapps_release.release import selected_groups
          selected_groups(os.environ['REQUESTED_PACKAGES'])
          PY

      - name: Load release environment from myenv
        if: ${{ !inputs.verify_only }}
        run: python deploy/scripts/environment.py

      - name: Verify publication permissions without publishing
        if: ${{ !inputs.verify_only }}
        run: python deploy/scripts/check_access.py

      - name: Configure HTTPS Git authentication
        run: |
          chmod +x "$GITHUB_WORKSPACE/deploy/scripts/git_askpass.py"
          echo "GIT_ASKPASS=$GITHUB_WORKSPACE/deploy/scripts/git_askpass.py" >> "$GITHUB_ENV"
          git lfs install

      - name: Configure publication identity and SourceForge host
        if: ${{ !inputs.verify_only }}
        run: |
          git config --global user.name "$USER_NAME"
          git config --global user.email "$EMAIL"
          mkdir -p ~/.ssh
          ssh-keyscan frs.sourceforge.net >> ~/.ssh/known_hosts

      - name: Make room for full release artifacts
        if: runner.environment == 'github-hosted'
        run: |
          # Unused SDKs on this disposable runner; keep Android build-tools.
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/powershell /usr/local/lib/android/sdk/ndk
          df -h .

      - name: Resolve Stable and overlay source revisions
        working-directory: release
        env:
          REQUESTED_STABLE_COMMIT: ${{ inputs.stable_commit }}
          REQUESTED_OVERLAY_SOURCE_COMMIT: ${{ inputs.overlay_source_commit }}
          VERIFY_ONLY: ${{ inputs.verify_only }}
          GITLAB_SOURCE_READ_TOKEN: ${{ secrets.GITLAB_SOURCE_READ_TOKEN }}
        run: |
          if [ "$VERIFY_ONLY" = 'true' ]; then
            export GITLAB_TOKEN="$GITLAB_SOURCE_READ_TOKEN"
          fi
          python ../deploy/scripts/checkout_release_source.py https://gitlab.com/nikgapps/17_stable.git .work/17_stable STABLE_COMMIT --commit "$REQUESTED_STABLE_COMMIT"
          python ../deploy/scripts/checkout_release_source.py https://gitlab.com/nikgapps/overlays_17_source.git .work/overlays_17_source OVERLAY_SOURCE_COMMIT --commit "$REQUESTED_OVERLAY_SOURCE_COMMIT"

      - name: Prepare publication repositories
        if: ${{ !inputs.verify_only }}
        working-directory: release
        run: |
          git clone --depth=1 https://github.com/nikgapps/tracker.git .work/tracker
          git clone --depth=1 https://github.com/nikgapps/nikgapps.github.io.git .work/website

      - name: Locate Android build tools
        id: tools
        run: |
          tools="$ANDROID_HOME/build-tools/36.1.0"
          if [ ! -x "$tools/aapt2" ]; then
            sdkmanager --install 'build-tools;36.1.0'
          fi
          if [ ! -f "$ANDROID_HOME/platforms/android-37.0/android.jar" ] && [ ! -f "$ANDROID_HOME/platforms/android-37/android.jar" ]; then
            sdkmanager --install 'platforms;android-37.0'
          fi
          test -x "$tools/aapt2"
          test -x "$tools/zipalign"
          echo "aapt2=$tools/aapt2" >> "$GITHUB_OUTPUT"
          echo "$tools" >> "$GITHUB_PATH"

      - name: Prepare pinned overlay toolchain
        working-directory: release
        run: python -m scripts.overlay_toolchain

      - name: Run registry-backed production release
        if: ${{ !inputs.verify_only }}
        id: production
        working-directory: release
        env:
          REQUESTED_PACKAGES: ${{ inputs.packages }}
        run: |
          python main.py --mode production \
            --source .work/17_stable --overlay-source .work/overlays_17_source \
            --overlay-source-commit "$OVERLAY_SOURCE_COMMIT" --verify-core \
            --package-source registry --changelog changelogs.yaml \
            --packages "$REQUESTED_PACKAGES" --stable-commit "$STABLE_COMMIT" \
            --release-commit "$RELEASE_COMMIT" \
            --aapt2 '${{ steps.tools.outputs.aapt2 }}'

      - name: Build complete release without publishing
        if: inputs.verify_only
        id: verification
        working-directory: release
        env:
          REQUESTED_PACKAGES: ${{ inputs.packages }}
        run: |
          python main.py --mode local --metadata-source preview --package-source registry \
            --refresh-snapshot --no-compare --source .work/17_stable \
            --overlay-source .work/overlays_17_source --verify-core \
            --overlay-source-commit "$OVERLAY_SOURCE_COMMIT" --stable-commit "$STABLE_COMMIT" \
            --release-commit "$RELEASE_COMMIT" \
            --packages "$REQUESTED_PACKAGES" --aapt2 '${{ steps.tools.outputs.aapt2 }}'

      - name: Preserve metadata, checksums and publication receipts
        if: ${{ always() && !inputs.verify_only }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: android-17-stable-release
          path: |
            release/dist/**/run-state.json
            release/dist/**/latest.json
            release/dist/**/release-manifest.json
            release/dist/**/publication.json
            release/dist/**/release-links.json
            release/dist/**/SHA256SUMS
            release/dist/**/nikgapps.config
            release/.work/run-state.json
            release/.work/production/*/registry/published-urls.json
            release/.work/production/*/registry/metadata/
            release/.work/production/*/download-metadata/
            release/.work/production/*/github-mirror/mirror-receipt.json
            release/.work/local/*/registry/metadata/
            release/.work/production/*/overlays/report.json
            release/.work/local/*/overlays/report.json
            release/.work/production/*/core-smoke/report.json
            release/.work/local/*/core-smoke/report.json
            release/.work/tracker/release_tracker.json
            release/.work/tracker/config_version.json
            release/.work/website/_data/changelogs.yaml
            !release/**/*.zip
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14

      - name: Summarize publication
        if: always()
        env:
          VERIFY_ONLY: ${{ inputs.verify_only }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              title = 'Android 17 local verification (no publication)' if os.environ['VERIFY_ONLY'] == 'true' else 'Android 17 stable release'
              summary.write('## ' + title + '\n\n')
              for label, key in [('Release engine/changelog', 'RELEASE_COMMIT'), ('Stable source', 'STABLE_COMMIT'), ('Overlay source', 'OVERLAY_SOURCE_COMMIT')]:
                  summary.write(f"- {label}: `{os.environ.get(key, 'not resolved')}`\n")
              state_file = Path('release/.work/run-state.json')
              if state_file.exists():
                  state = json.loads(state_file.read_text())
                  for key in ('registryReleaseId', 'configVersion', 'packageSource'):
                      summary.write(f"- {key}: `{state.get(key, 'not resolved')}`\n")
                  for stage, status in state['stages'].items():
                      summary.write(f'- {stage}: {status}\n')
                  overlays = state.get('overlayBuild', {})
                  if overlays:
                      summary.write(f"- Freshly built overlay APKs: {len(overlays['files'])}\n")
                      summary.write(f"- apktool: {overlays.get('apktool', {}).get('version', 'bundled')}\n")
                      summary.write(f"- Overlay source tree SHA-256: `{overlays['sourceTreeSha256']}`\n")
                  candidate = state.get('candidate')
                  manifest = Path(candidate) / 'release-manifest.json' if candidate else None
                  if manifest and manifest.is_file():
                      for artifact in json.loads(manifest.read_text())['files']:
                          names = artifact.get('validation', {}).get('pixelLauncherOverlays', [])
                          if names:
                              summary.write(f"- {Path(artifact['path']).name}: validated Pixel Launcher overlays {', '.join(names)}\n")
          PY
