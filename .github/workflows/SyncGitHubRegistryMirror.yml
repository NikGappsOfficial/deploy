name: Sync GitHub Registry Mirror
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: stable-registry-publication
  cancel-in-progress: false
env:
  G_TOKEN: ${{ secrets.G_TOKEN }}
  CATALOG_PROJECT: ${{ vars.GITLAB_CATALOG_PROJECT_ID || '85036487' }}
jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install 'PyYAML~=6.0.3' 'python-dotenv~=1.2.4' 'requests~=2.34.2'
      - name: Resolve release engine ref
        id: engine
        run: |
          python - <<'PY'
          import os, yaml
          from pathlib import Path
          workflow = yaml.load(Path('.github/workflows/NikGappsAndroid17Release.yml').read_text(), Loader=yaml.BaseLoader)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f"ref={workflow['env']['RELEASE_REF']}\n")
          PY
      - uses: actions/checkout@v7.0.1
        with:
          repository: nikhilmenghani/nikgapps-release
          ref: ${{ steps.engine.outputs.ref }}
          token: ${{ secrets.G_TOKEN }}
          path: release
          persist-credentials: false
      - name: Resolve pinned mirror builder
        id: builder
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          pin = json.loads(Path('release/builder-pin.json').read_text())
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f"commit={pin['commit']}\n")
          PY
      - uses: actions/checkout@v7.0.1
        with:
          repository: nikgapps/project
          ref: ${{ steps.builder.outputs.commit }}
          path: release/.engine
          persist-credentials: false
      - name: Load publisher credentials from myenv
        run: python release/scripts/environment.py
      - name: Mirror verified packages and publish metadata atomically
        working-directory: release
        run: python -m scripts.github_mirror
      - name: Preserve mirror verification receipt
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: github-registry-mirror-receipt
          path: release/.work/github-mirror/mirror-receipt.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
