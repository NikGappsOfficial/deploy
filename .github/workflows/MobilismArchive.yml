name: Mobilism archive

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Check access or download and publish newer releases
        type: choice
        options: [preflight, archive, diagnostics]
        default: preflight
      runner:
        description: Runner for HTTP access diagnostics
        type: choice
        options: [ubuntu-24.04, macos-15]
        default: ubuntu-24.04

permissions:
  contents: read

concurrency:
  group: mobilism-archive
  cancel-in-progress: false

jobs:
  archive:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || vars.MOBILISM_ARCHIVE_ENABLED == 'true')
    runs-on: ${{ inputs.mode == 'diagnostics' && inputs.runner || 'ubuntu-24.04' }}
    timeout-minutes: 330
    defaults:
      run:
        working-directory: cron
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout deploy
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Use existing private-source SSH access
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      - name: Fetch cron source
        working-directory: .
        run: git clone --depth=1 git@github.com:nikhilmenghani/cron.git cron
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: cron/requirements-mobilism.txt
      - name: Install archive dependencies and APK inspector
        run: |
          python -m pip install -r requirements-mobilism.txt
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends aapt
          fi
      - name: Test archive and validate private cron configuration
        run: |
          python - <<'PY'
          from mobilism_config import CREDENTIAL_NAMES, credential, load_credentials
          private = load_credentials()
          missing = sorted(name for name in CREDENTIAL_NAMES if not credential(name, private))
          if missing:
              raise SystemExit('Configure the private cron credential file: ' + ', '.join(missing))
          for value in private.values():
              escaped = value.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('::add-mask::' + escaped)
          PY
          python -m unittest test_mobilism_to_telegram test_mobilism_apk test_mobilism_github_state test_mobilism_config -q
      - name: Diagnose Mobilism HTTP access without publishing
        if: inputs.mode == 'diagnostics'
        run: python mobilism_diagnostics.py
      - name: Restore encrypted history and acquire archive lease
        id: state
        if: inputs.mode != 'diagnostics'
        run: python mobilism_github_state.py begin
      - name: Check Telegram access
        if: inputs.mode != 'diagnostics'
        run: python mobilism_to_telegram.py preflight
      - name: Archive new releases
        if: github.event_name == 'schedule' || inputs.mode == 'archive'
        run: python mobilism_to_telegram.py --source forum run
      - name: Save encrypted history even if archiving failed
        if: always() && steps.state.outcome == 'success'
        run: python mobilism_github_state.py finish
