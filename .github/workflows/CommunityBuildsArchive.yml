name: Community builds archive

on:
  schedule:
    - cron: '37 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Check access or publish changed watched APKs
        type: choice
        options: [preflight, archive]
        default: preflight

permissions:
  contents: read

concurrency:
  group: community-builds-archive
  cancel-in-progress: false

jobs:
  archive:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || vars.COMMUNITY_BUILDS_ARCHIVE_ENABLED == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    defaults:
      run:
        working-directory: cron
        shell: bash
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout deploy
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Use existing private-repository SSH access
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      - name: Fetch cron
        working-directory: .
        run: git clone --depth=1 git@github.com:nikhilmenghani/cron.git cron
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: cron/requirements-mobilism.txt
      - name: Install archive dependencies and APK inspector
        run: |
          python -m pip install -r requirements-mobilism.txt
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends aapt
      - name: Mask private configuration and test
        run: |
          python - <<'PY'
          from mobilism_config import load_credentials
          for value in load_credentials().values():
              escaped = value.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('::add-mask::' + escaped)
          PY
          python -m unittest test_community_builds test_mobilism_to_telegram test_mobilism_apk test_mobilism_github_state test_mobilism_config -q
      - name: Verify provider and archive access without publishing
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'preflight'
        run: python community_builds_to_telegram.py preflight
      - name: Archive changed watched builds
        if: github.event_name == 'schedule' || inputs.mode == 'archive'
        run: python community_builds_to_telegram.py run
