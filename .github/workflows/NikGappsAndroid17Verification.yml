name: NikGapps Android 17 Stable Build Verification

on:
  workflow_dispatch:
    inputs:
      packages:
        description: Package groups to build and verify
        type: string
        default: core,corego,basic,omni,stock,full,go,addonsets,addons,removeotascripts,debloater
        required: true

permissions:
  contents: read

concurrency:
  group: android17-stable-build-verification
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository == 'NikGappsOfficial/deploy' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      REVIEW_ROOT: ${{ runner.temp }}/stable-build-verification
      GIT_TERMINAL_PROMPT: '0'
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Check out current Release main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: nikhilmenghani/nikgapps-release
          ref: main
          token: ${{ secrets.G_TOKEN }}
          path: release
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Free build space on the hosted runner
        if: runner.environment == 'github-hosted'
        run: |
          sudo rm -rf -- /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/lib/android/sdk/ndk
          df -h "$RUNNER_TEMP"

      - name: Prepare the installed engine and Android tools
        working-directory: release
        run: |
          python -m pip install .
          tools="$ANDROID_HOME/build-tools/36.1.0"
          if [ ! -x "$tools/aapt2" ]; then
            sdkmanager --install 'build-tools;36.1.0'
          fi
          if [ ! -f "$ANDROID_HOME/platforms/android-37.0/android.jar" ] && [ ! -f "$ANDROID_HOME/platforms/android-37/android.jar" ]; then
            sdkmanager --install 'platforms;android-37.0'
          fi
          test -x "$tools/aapt2"
          test -x "$tools/zipalign"
          printf '%s\n' "$tools" >> "$GITHUB_PATH"
          printf 'AAPT2=%s\n' "$tools/aapt2" >> "$GITHUB_ENV"
          printf 'AAPT2_SHA256=%s\n' "$(sha256sum "$tools/aapt2" | cut -d ' ' -f 1)" >> "$GITHUB_ENV"
          apktool="$(python -m scripts.overlay_toolchain --output "$REVIEW_ROOT/tools")"
          test -f "$apktool"
          printf 'APKTOOL_JAR=%s\n' "$apktool" >> "$GITHUB_ENV"

      - name: Pin Stable packages and overlay source
        working-directory: release
        run: |
          mkdir -p "$REVIEW_ROOT"
          git lfs install --skip-repo
          for repository in 17_stable overlays_17_source; do
            checkout="$REVIEW_ROOT/$repository"
            url="https://gitlab.com/nikgapps/$repository.git"
            GIT_LFS_SKIP_SMUDGE=1 git clone --branch main --single-branch --depth=1 "$url" "$checkout"
            revision="$(git -C "$checkout" rev-parse HEAD)"
            GIT_LFS_SKIP_SMUDGE=1 git -C "$checkout" checkout --detach "$revision"
            git -C "$checkout" lfs pull origin
            test -z "$(git -C "$checkout" status --porcelain)"
          done
          printf 'RELEASE_COMMIT=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          printf 'STABLE_COMMIT=%s\n' "$(git -C "$REVIEW_ROOT/17_stable" rev-parse HEAD)" >> "$GITHUB_ENV"
          printf 'OVERLAY_COMMIT=%s\n' "$(git -C "$REVIEW_ROOT/overlays_17_source" rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Build and validate the Stable release preview
        working-directory: release
        env:
          REQUESTED_PACKAGES: ${{ inputs.packages }}
        run: |
          args=(
            --mode local --metadata-source preview --package-source registry
            --refresh-snapshot --no-compare --verify-core
            --release-commit "$RELEASE_COMMIT" --stable-commit "$STABLE_COMMIT"
            --overlay-source-commit "$OVERLAY_COMMIT"
            --source "$REVIEW_ROOT/17_stable" --overlay-source "$REVIEW_ROOT/overlays_17_source"
            --aapt2 "$AAPT2" --apktool-jar "$APKTOOL_JAR" --packages "$REQUESTED_PACKAGES"
            --metadata-snapshot "$REVIEW_ROOT/published" --work "$REVIEW_ROOT/work" --output "$REVIEW_ROOT/output"
          )
          python main.py "${args[@]}"

      - name: Summarize build validation
        if: always()
        working-directory: release
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          from nikgapps_release.release import verify_outputs

          work = Path(os.environ["REVIEW_ROOT"]) / "work"
          state_path = work / "run-state.json"
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("## Android 17 Stable build verification\n\n")
              for label, key in (("Release engine", "RELEASE_COMMIT"), ("Stable packages", "STABLE_COMMIT"),
                                 ("Stable overlay source", "OVERLAY_COMMIT"), ("aapt2 SHA-256", "AAPT2_SHA256")):
                  summary.write(f"- {label} `{os.environ.get(key, 'unresolved')}`\n")
              if not state_path.is_file():
                  summary.write("\nThe build did not start. See the preceding job steps.\n")
              else:
                  state = json.loads(state_path.read_text(encoding="utf-8"))
                  for stage, status in state["stages"].items():
                      summary.write(f"- {stage} **{status}**\n")
                  overlays = state.get("overlayBuild", {})
                  if overlays:
                      apktool = overlays["apktool"]
                      summary.write(f"- Compiled {len(overlays['files'])} overlays with apktool {apktool['version']}\n")
                      for item in overlays["files"]:
                          if item["path"].startswith("PixelLauncherOverlay/"):
                              summary.write(f"- {Path(item['path']).name} SHA-256 `{item['sha256']}`\n")
                  if state.get("candidate"):
                      receipt = verify_outputs(Path(state["candidate"]))
                      summary.write(f"\nPreview config v{receipt['configVersion']} from local registry "
                                    f"`{receipt['registryReleaseId']}`. Outer ZIP hashes verified.\n\n")
                      summary.write("| ZIP | Packages | Payload files | Overlay hashes | Privileged-permission files |\n"
                                    "| --- | ---: | ---: | ---: | ---: |\n")
                      for file in receipt["files"]:
                          if "validation" not in file:
                              continue
                          counts = file["validation"]
                          summary.write(f"| {Path(file['path']).name} | {file['packageCount']} | "
                                        f"{counts['payloadFiles']} | {counts['overlayFiles']} | "
                                        f"{counts['privAppPermissionFiles']} |\n")
          PY
